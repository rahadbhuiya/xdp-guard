[package]
name = "xdp-guard-common"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Common data structures and rule definitions for xdp-guard high-performance eBPF/XDP firewall"
keywords = ["xdp", "ebpf", "ddos", "networking", "no-std"]
categories = ["network-programming", "no-std"]

[features]
default = []
user = ["dep:aya"]

[dependencies]
bytemuck = { version = "1.16", default-features = false, features = ["derive"] }
aya = { version = "0.13", default-features = false, optional = true }
