apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "xdp-guard.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.config.metricsPort }}"
        prometheus.io/path: "/metrics"
    spec:
      hostNetwork: true
      hostPID: true
      priorityClassName: {{ .Values.priorityClassName }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      containers:
        - name: xdp-guard
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /sys/fs/bpf
              mount -t bpf bpf /sys/fs/bpf 2>/dev/null || true
              TARGET_IFACE=${IFACE:-$(ip route show default | awk '{print $5}' | head -n1)}
              TARGET_IFACE=${TARGET_IFACE:-eth0}
              TARGET_MODE=${XDP_MODE:-skb}
              /usr/local/bin/xdp-guard attach --iface "${TARGET_IFACE}" --mode "${TARGET_MODE}" &
              sleep 2
              exec /usr/local/bin/xdp-guard exporter --listen "0.0.0.0:{{ .Values.config.metricsPort }}"
          env:
            - name: IFACE
              value: "{{ .Values.config.iface }}"
            - name: XDP_MODE
              value: "{{ .Values.config.mode }}"
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
                - SYS_ADMIN
                - BPF
          ports:
            - name: metrics
              containerPort: {{ .Values.config.metricsPort }}
              hostPort: {{ .Values.config.metricsPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.config.metricsPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.config.metricsPort }}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: bpf-fs
              mountPath: /sys/fs/bpf
              mountPropagation: Bidirectional
            - name: kernel-modules
              mountPath: /lib/modules
              readOnly: true
            - name: kernel-debug
              mountPath: /sys/kernel/debug
      volumes:
        - name: bpf-fs
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        - name: kernel-modules
          hostPath:
            path: /lib/modules
        - name: kernel-debug
          hostPath:
            path: /sys/kernel/debug
