apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: xdp-guard
  namespace: kube-system
  labels:
    app.kubernetes.io/name: xdp-guard
    app.kubernetes.io/part-of: xdp-guard-engine
    app.kubernetes.io/component: network-security
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: xdp-guard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: xdp-guard
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9184"
        prometheus.io/path: "/metrics"
    spec:
      hostNetwork: true
      hostPID: true
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
      containers:
        - name: xdp-guard
          image: ghcr.io/rahadbhuiya/xdp-guard:v0.3.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              echo "[+] Starting xdp-guard in Kubernetes Host Network..."
              mkdir -p /sys/fs/bpf
              mount -t bpf bpf /sys/fs/bpf 2>/dev/null || true
              
              # Auto-detect default network interface if IFACE not set
              TARGET_IFACE=${IFACE:-$(ip route show default | awk '{print $5}' | head -n1)}
              TARGET_IFACE=${TARGET_IFACE:-eth0}
              TARGET_MODE=${XDP_MODE:-skb}
              
              echo "[+] Attaching xdp-guard to ${TARGET_IFACE} (mode: ${TARGET_MODE})..."
              /usr/local/bin/xdp-guard attach --iface "${TARGET_IFACE}" --mode "${TARGET_MODE}" &
              
              sleep 2
              echo "[+] Starting Prometheus Metrics Exporter on 0.0.0.0:9184..."
              exec /usr/local/bin/xdp-guard exporter --listen "0.0.0.0:9184"
          env:
            - name: IFACE
              value: ""
            - name: XDP_MODE
              value: "skb"
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
                - SYS_ADMIN
                - BPF
          ports:
            - name: metrics
              containerPort: 9184
              hostPort: 9184
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9184
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9184
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 1000m
              memory: 256Mi
          volumeMounts:
            - name: bpf-fs
              mountPath: /sys/fs/bpf
              mountPropagation: Bidirectional
            - name: kernel-modules
              mountPath: /lib/modules
              readOnly: true
            - name: kernel-debug
              mountPath: /sys/kernel/debug
      volumes:
        - name: bpf-fs
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        - name: kernel-modules
          hostPath:
            path: /lib/modules
        - name: kernel-debug
          hostPath:
            path: /sys/kernel/debug
